<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Krowns</title>
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

  <!-- Title screen -->
  <main id="start">
    <div class="start-inner">
      <div class="logo" id="logo"></div>
      <h1>Krowns</h1>
      <p class="tagline">A world of little souls. Each one is a mystery.</p>
      <button id="btn-create" class="big-btn">Create world</button>
      <p class="fine">Click a soul to see what it shows you. Scroll to zoom, drag to move.</p>
    </div>
  </main>

  <!-- The game -->
  <div id="game" hidden>
    <canvas id="canvas"></canvas>
    <div id="bubbles"></div>
    <aside id="panel"></aside>

    <header id="hud-left">
      <div class="hud-title" id="hud-title">Krowns</div>
      <div class="hud-line" id="hud-world"></div>
      <div class="hud-line hud-clock" id="hud-time"></div>
      <div class="hud-line" id="hud-count"></div>
    </header>

    <nav id="hud-right">
      <button id="btn-pause" title="Pause (space)"></button>
      <button id="btn-s1" class="speed" title="Normal speed (1)">1x</button>
      <button id="btn-s2" class="speed" title="Faster (2)">2x</button>
      <button id="btn-s4" class="speed" title="Fastest (3)">4x</button>
      <span class="sep"></span>
      <button id="btn-sound" title="Sound on/off (M)"></button>
      <button id="btn-zout" title="Zoom out (-)"></button>
      <button id="btn-zin" title="Zoom in (+)"></button>
      <button id="btn-fit" title="Show the whole world (F)"></button>
      <button id="btn-new" title="Create a new world"></button>
    </nav>

    <section id="chronicle">
      <button id="btn-history" title="History of the world"></button>
      <div id="feed"></div>
      <div id="history" hidden></div>
    </section>

    <div id="hint">Click a soul or a castle. Scroll to zoom. Drag to move.</div>
  </div>

  <script src="js/util.js?v=5"></script>
  <script src="js/names.js?v=5"></script>
  <script src="js/words.js?v=5"></script>
  <script src="js/sim.js?v=5"></script>
  <script src="js/icons.js?v=5"></script>
  <script src="js/audio.js?v=5"></script>
  <script src="js/render.js?v=5"></script>
  <script src="js/main.js?v=5"></script>
</body>
</html>
