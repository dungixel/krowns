<!doctype html>
<html lang="en" data-v="8">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Krowns</title>
<meta name="description" content="Krowns - a tiny meadow.">
<link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
<canvas id="game"></canvas>
<button id="menu" class="card" title="Menu (Esc)">&larr; Menu</button>
<div id="lines" class="card">
  <button id="lines-head"><span id="lines-title">Neighbour</span> <span id="lines-arrow">&#9662;</span></button>
  <div id="lines-list"></div>
</div>

<div id="start" class="show">
  <div class="box card">
    <div id="step-title">
      <h1>Krowns</h1>
      <p>A quiet meadow with trees. Somebody lives here.</p>
      <button id="btn-play" class="go" disabled>Loading...</button>
    </div>
    <div id="step-name">
      <h1>Who are you?</h1>
      <p>Pick a name for your knight.</p>
      <input id="name" maxlength="12" autocomplete="off" spellcheck="false" placeholder="Your name">
      <button id="btn-go" class="go" disabled>Walk into the meadow</button>
      <div class="hint">Move with WASD or the arrow keys &middot; mouse wheel zooms &middot; pick what your neighbour says in the list (keys 1-9, 0; E repeats)</div>
    </div>
  </div>
</div>

<script src="data/game-data.js?v=8"></script>
<script src="js/util.js?v=8"></script>
<script src="js/data.js?v=8"></script>
<script src="js/names.js?v=8"></script>
<script src="js/world.js?v=8"></script>
<script src="js/voice.js?v=8"></script>
<script src="js/npc.js?v=8"></script>
<script src="js/render.js?v=8"></script>
<script src="js/main.js?v=8"></script>
</body>
</html>
